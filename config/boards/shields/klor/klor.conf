# Включение поддержки энкодеров по умолчанию
CONFIG_EC11=y

# Переключаем обработку энкодеров в собственный высокоприоритетный поток
# Это устраняет "рваность" и пропуски шагов при быстрой прокрутке
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n
CONFIG_EC11_TRIGGER_OWN_THREAD=y

# ОТКЛЮЧАЕМ старый OLED дисплей половин для совместимости с донглом YADS
CONFIG_ZMK_DISPLAY=n

# Включение RGB подсветки клавиш по умолчанию
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
