# ==========================================================================
# ОСНОВНЫЕ НАСТРОЙКИ РОЛИ ДОНГЛА
# ==========================================================================
# Переводим контроллер донгла в режим центрального узла
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Указываем количество беспроводных половинок (левая + правая)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# МАКСИМАЛЬНАЯ МОЩНОСТЬ ПЕРЕДАТЧИКА (+8 dBm) ДЛЯ ДОНГЛА
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ==========================================================================
# ZMK STUDIO И БЛЮТУЗ ПРОФИЛИ
# ==========================================================================
# ВКЛЮЧАЕМ ZMK STUDIO (Изменение функций клавиш и крутилок "на лету")
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Настройки лимитов подключений под нужды донгла и ZMK Studio
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Разрешаем донглу транслировать детальный статус на экран YADS
CONFIG_ZMK_STATUS_ADVERTISEMENT=y

# ==========================================================================
# АППАРАТНАЯ ЧАСТЬ ДОНГЛА (Энкодеры и Подсветка)
# ==========================================================================
# Включаем поддержку энкодеров на стороне донгла
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Синхронизация RGB-эффектов подсветки половинок
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# ==========================================================================
# НАСТРОЙКА ДИСПЛЕЯ YADS И WPM ДЛЯ ВЕТКИ V0.3-BRANCH
# ==========================================================================
# Включаем общую подсистему дисплеев ZMK и графический движок LVGL
CONFIG_ZMK_DISPLAY=y

# Активируем непосредственно экран модуля YADS
CONFIG_YADS_DISPLAY=y

# Включаем отслеживание скорости печати ОДНОСТОРОННЕ только на донгле
CONFIG_ZMK_WPM=y

# Принудительно отключаем родной экран половин KLOR для самого донгла,
# чтобы сборщик игнорировал klor_status_screen.c и не искал матрицу клавиш
CONFIG_KLOR_DISPLAY=n
