# ========== BLE / SPLIT ==========
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ========== ZMK Studio ==========
# Включаем Studio и отключаем блокировку (не нужна &studio_unlock)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ========== BLE Connections ==========
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# ========== Power ==========
# Донгл не должен переходить в глубокий сон
CONFIG_ZMK_SLEEP=n

# ========== RGB (отключаем на донгле) ==========
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# ========== Display / YADS ==========
CONFIG_ZMK_DISPLAY=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_LVGL=y

# Отключаем стандартное гашение дисплея по idle ZMK.
# Показом картинки и гашением подсветки управляет YADS.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Датчик света отключен
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=70

# Через 20 секунд бездействия появляется картинка
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=20

# Включаем idle-картинку
CONFIG_DONGLE_SCREEN_IDLE_IMAGE=y

# Через 30 секунд показа картинки начинается гашение подсветки
CONFIG_DONGLE_SCREEN_IDLE_IMAGE_BLANK_DELAY_S=30

# Память LVGL
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# ========== WPM ==========
CONFIG_ZMK_WPM=y
