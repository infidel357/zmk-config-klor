# ==========================================================================
# ОСНОВНЫЕ НАСТРОЙКИ РОЛИ ДОНГЛА
# ==========================================================================
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Указываем количество беспроводных половинок (левая + правая)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# МАКСИМАЛЬНАЯ МОЩНОСТЬ ПЕРЕДАТЧИКА (+8 dBm) ДЛЯ ДОНГЛА
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ==========================================================================
# ZMK STUDIO И БЛЮТУЗ ПРОФИЛИ
# ==========================================================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ОПТИМИЗАЦИЯ ДЛЯ ZMK v0.3: Ограничиваем количество BLE-соединений.
# Формула: 2 половинки + макс. 2 хоста (включая ZMK Studio) = 4. 
# Значение 5+ сожрет лишнюю RAM, которая нужна графическому движку.
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# ==========================================================================
# АППАРАТНАЯ ЧАСТЬ ДОНГЛА (Подсветка)
# ==========================================================================
# ИСПРАВЛЕНО: Удалены строки CONFIG_EC11, так как на донгле нет энкодеров.
# Синхронизация RGB-эффектов подсветки половинок
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# ==========================================================================
# НАСТРОЙКА ДИСПЛЕЯ YADS И WPM ДЛЯ ВЕТКИ V0.3-BRANCH
# ==========================================================================
CONFIG_ZMK_DISPLAY=y

# ИСПРАВЛЕНО ДЛЯ ZEPHYR v3.5: Явно включаем драйверы шины и дисплея ST7789V
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_LVGL=y

# Активируем непосредственно экран модуля YADS
CONFIG_YADS_DISPLAY=y

# ИСПРАВЛЕНО ДЛЯ ВАШЕЙ ПЛАТЫ: Отключаем опрос отсутствующего датчика света.
# Без этого донгл зависнет на старте при попытке считать данные с I2C.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=70

# ОПТИМИЗАЦИЯ RAM ПОД ЭКРАН WAVESHARE 1.69" (Защита от ошибки Region RAM overflow)
# Выделяем буфер под графику LVGL для разрешения 240x280.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Включаем отслеживание скорости печати ОДНОСТОРОННЕ только на донгле
CONFIG_ZMK_WPM=y

# Принудительно отключаем родной экран половин KLOR для самого донгла
CONFIG_KLOR_DISPLAY=n
