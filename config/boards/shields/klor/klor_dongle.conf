# ========== BLE / SPLIT ==========
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ========== ZMK Studio (отключаем) ==========
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n

# ========== BLE Connections ==========
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# ========== RGB (отключаем на донгле) ==========
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# ========== Display / YADS ==========
CONFIG_ZMK_DISPLAY=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_LVGL=y

CONFIG_YADS_DISPLAY=y

# Датчик света отключен
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=70

# Память LVGL
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# ========== WPM ==========
CONFIG_ZMK_WPM=y

# Отключаем дисплей KLOR
CONFIG_KLOR_DISPLAY=n
